[build-system]
requires = ["setuptools>=61", "wheel", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astl"
# Version is sourced dynamically from top-level VERSION.md by setup.py (avoid duplication)
dynamic = ["version"]
description = "Python bindings for Arm SoC Telemetry Library (ASTL)"
authors = [{name="Arm ASTL Team"}]
license = "Apache-2.0"
readme = "docs/README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C",
  "Programming Language :: Python :: Implementation :: CPython"
]

[project.urls]
Homepage = "https://github.com/Arm-Debug/ASTL"

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
astl-diagnostics = "astl.diagnostics:diagnostics_cli"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
show_error_codes = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
exclude = ["build/"]


# Explicitly tell setuptools to look in current directory for packages
[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true
