name: Lint

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: write

# run this workflow serially for each PR. Cancel stale runs. fall back on github.ref if non-PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to true to terminate the jobs as soon as any one fails. set to false for debug
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        cmake_preset: [debug-make]

    env:
      _VCPKG_: ${{ github.workspace }}/external/vcpkg

    steps:
      - name: 🔑 Create source checkout token
        id: source-checkout-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APAP_APP_APP_ID }}
          private-key: ${{ secrets.APAP_APP_PRIVATE_KEY }}
          owner: Arm-Debug
          repositories: ASTL,mock-SCMI
          permission-contents: read

      - name: ⤵️ Checkout code
        uses: actions/checkout@v7
        with:
          # fetch all history so we can git diff for clang-tidy relevant files
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.source-checkout-token.outputs.token }}
          submodules: true

      - name: ⤵️ Install Tools (ubuntu-latest)
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y clang-format-20 clang-tidy-20 cppcheck cmake make yamllint libsensors-dev parallel python3 python3-pip clang-format-20 clang-20 libclang-rt-20-dev pkg-config
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-20 200
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-20 200
          python3 -m pip install --upgrade --break-system-packages --user cmakelang reuse
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Restore per-package vcpkg cache
      - name: ⤵️ VCPKG - Restore Cache
        id: vcpkg-cache
        uses: TAServers/vcpkg-cache@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⤵️ VCPKG - Install Dependencies
        uses: lukka/run-vcpkg@v11
        env:
          VCPKG_FEATURE_FLAGS: binarycaching
          VCPKG_BINARY_SOURCES: clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite
        with:
          vcpkgDirectory: "${{ env._VCPKG_ }}"
          vcpkgJsonGlob: "**/vcpkg.json"

      - name: ⚙️ CMake - Configure
        # Configure CMake in a 'build' subdirectory.
        env:
          VCPKG_FEATURE_FLAGS: binarycaching
          VCPKG_BINARY_SOURCES: clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite
        run: |
          cmake --version
          clang --version
          make --version
          cmake \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DENABLE_VALGRIND=OFF \
            -S "${{ github.workspace }}" \
            --preset ${{ matrix.cmake_preset }}

      - name: ⚙️ CMake - Generate Proto Headers
        run: cmake --build --preset ${{ matrix.cmake_preset }} --target proto_gen

      - name: 🧹 YAML Lint
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: find .github -type f \( -iname '*.yml' -o -iname '*.yaml' \) | xargs yamllint

      - name: 🧹 Check Formatting
        run: ${{ github.workspace }}/scripts/check_format.sh

      - name: 🧹 Check Wrapper Coverage
        run: python3 ${{ github.workspace }}/scripts/check_wrapper_coverage.py

      - name: 🧪 Test API Policy Checker
        run: python3 -m unittest discover -s ${{ github.workspace }}/scripts/tests -p 'test_*.py' -v

      - name: 🏷️ Label Public API Changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed_api_files="$(git diff --name-only "${BASE_SHA}...HEAD" -- include/)"
          if [[ -n "${changed_api_files}" ]]; then
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
              -f "labels[]=impacts_api"
          fi

      - name: 🔒 Check Public API Policy
        shell: bash
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "${BASE_REF}" || "${BASE_REF}" =~ ^0+$ ]]; then
            BASE_REF="HEAD"
          fi
          python3 "${{ github.workspace }}/scripts/check_api_policy.py" --base-ref "${BASE_REF}"

      - name: 🧹 Lint with cppcheck
        run: ${{ github.workspace }}/scripts/cppcheck.sh ${{ github.workspace }}/build/${{ matrix.cmake_preset }}

      - name: ️✍️ Check License Headers
        run: ./scripts/license_lint.sh

      - name: 🧹 Lint with clang-tidy
        run: ${{ github.workspace }}/scripts/lint.sh ${{ github.workspace }}/build/${{ matrix.cmake_preset }} pull-request
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}

      - name: 🧹 Lint with cmakelang
        run: ${{ github.workspace }}/scripts/cmakelang.sh
