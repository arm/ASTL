name: AI Code Review

on:
  pull_request:
    types: [labeled]
    branches: [main]
  workflow_dispatch:
permissions: read-all
jobs:
  review:
    if: contains(github.event.pull_request.labels.*.name, 'request-ai-review')
    runs-on: [self-hosted, Linux, aws-debug-prod]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: ⤵️ Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch Certificate for Proxy
        run: |
          curl --retry 5 -f -s https://artifactory.arm.com/artifactory/vault.pki/ent-pki/pem/certs/ARM%20Enterprise%20PKI%20Root%20CA.pem -o arm.pem

      - name: 🚀 AI Code Review
        uses: Arm-Debug/ai-code-review@42588a6f279119a14451175b07774364887ffff3
        continue-on-error: true
        with:
          OPENAI_API_KEY: ${{ secrets.OPENAI_PROXY_KEY_FOR_SELF_HOSTED_RUNNERS }}
          OPENAI_BASE_URL: "https://openai-api-proxy.geo.arm.com/api/providers/openai-eu/v1"
          OPENAI_API_MODEL: "gpt-5-mini"
          REASONING_EFFORT: "high"
          CODE_REVIEW_GUIDELINES: ".github/workflows/AI_CODE_REVIEW.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/arm.pem

      - name: 🏷️ Remove 'request-ai-review' label
        if: always()
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: request-ai-review
