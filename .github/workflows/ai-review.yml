name: AI Code Review

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
    branches: [main]

jobs:
  review:
    if: contains(github.event.pull_request.labels.*.name, 'request-ai-review')
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: ⤵️ Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 AI Code Review
        uses: Arm-Debug/ai-code-review@315af0ad1604c20474454aafb4b2b56b9a6b8129
        continue-on-error: true
        with:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_MODEL: "o4-mini"
          REASONING_EFFORT: "high"
          CODE_REVIEW_GUIDELINES: ".github/workflows/AI_CODE_REVIEW.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Remove 'request-ai-review' label
        if: always()
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: request-ai-review
