name: Publish commits and releases to Arm public organization

permissions:
  contents: read

on:
  schedule:
    - cron: "15 23 * * *"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Completed stable release tag to publish immediately (for example release/1.2.3)"
        required: false
        type: string

concurrency:
  group: mirror-arm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: self-hosted-ubuntu-latest

    steps:
      - name: Checkout publisher
        uses: actions/checkout@v7

      - name: Get GitHub App Token
        id: get_installation_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ITS_ARM_ORG_APP_ID }}
          private-key: ${{ secrets.ITS_ARM_ORG_APP_PK }}
          owner: Arm
          repositories: ASTL
          permission-contents: write

      - name: Mirror main and tags
        env:
          SOURCE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_GITHUB_TOKEN: ${{ steps.get_installation_token.outputs.token }}
        run: |
          set -euo pipefail

          mirror_dir="$(mktemp -d "${RUNNER_TEMP}/astl-mirror.XXXXXX")"
          trap 'rm -rf -- "${mirror_dir}"' EXIT

          git clone --bare \
            "https://x-access-token:${SOURCE_GITHUB_TOKEN}@github.com/Arm-Debug/ASTL.git" \
            "${mirror_dir}/repo.git"

          git -C "${mirror_dir}/repo.git" remote add target \
            "https://x-access-token:${TARGET_GITHUB_TOKEN}@github.com/arm/ASTL.git"

          git -C "${mirror_dir}/repo.git" push --force target \
            'refs/heads/main:refs/heads/main'
          git -C "${mirror_dir}/repo.git" push --prune target \
            '+refs/tags/*:refs/tags/*' \
            ':refs/tags/release/rolling'
          git -C "${mirror_dir}/repo.git" push --force --prune target \
            'refs/heads/releases/*:refs/heads/releases/*' \
            ':refs/heads/releases/rolling'

      - name: Publish completed releases
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
          SOURCE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_GITHUB_TOKEN: ${{ steps.get_installation_token.outputs.token }}
        run: |
          set -euo pipefail

          if [[ -n "${RELEASE_TAG}" ]]; then
            release_tags=("${RELEASE_TAG}")
          else
            mapfile -t release_tags < <(
              GH_TOKEN="${SOURCE_GITHUB_TOKEN}" gh release list --repo Arm-Debug/ASTL --limit 1000 \
                --json tagName,isDraft,isPrerelease \
                --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName | select(test("^release/[0-9]+\\.[0-9]+\\.[0-9]+$"))'
            )
          fi

          for tag in "${release_tags[@]}"; do
            scripts/release/publish_public_release.sh "${tag}"
          done
