name: Mirror repo to Arm public organization

permissions:
  contents: read

on:
  schedule:
    - cron: "15 23 * * *"

  workflow_dispatch:

concurrency:
  group: mirror-arm
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: self-hosted-ubuntu-latest

    steps:
      - name: Get GitHub App Token
        id: get_installation_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ITS_ARM_ORG_APP_ID }}
          private-key: ${{ secrets.ITS_ARM_ORG_APP_PK }}
          owner: Arm

      - name: Mirror main and tags
        env:
          SRC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DST_TOKEN: ${{ steps.get_installation_token.outputs.token }}
        run: |
          set -euo pipefail

          mirror_dir="$(mktemp -d "${RUNNER_TEMP}/astl-mirror.XXXXXX")"
          trap 'rm -rf -- "${mirror_dir}"' EXIT

          git clone --bare \
            "https://x-access-token:${SRC_TOKEN}@github.com/Arm-Debug/ASTL.git" \
            "${mirror_dir}/repo.git"

          cd "${mirror_dir}/repo.git"

          git remote add target \
            "https://x-access-token:${DST_TOKEN}@github.com/arm/ASTL.git"

          git push --force target 'refs/heads/main:refs/heads/main'
          git push --prune target \
            '+refs/tags/*:refs/tags/*' \
            ':refs/tags/release/rolling'
