name: IP Scan

permissions:
  contents: read

# run this workflow serially for each PR. Cancel stale runs. fall back on github.ref if non-PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

jobs:
  ossmosis-ip-scan:
    if: github.repository_owner == 'Arm-Debug'
    runs-on: ubuntu-latest

    steps:
      - name: Check out target repository
        uses: actions/checkout@v7
        with:
          path: target
          fetch-depth: 0

      - name: Create ossmosis checkout token
        id: ossmosis-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APAP_APP_APP_ID }}
          private-key: ${{ secrets.APAP_APP_PRIVATE_KEY }}
          owner: Arm-Debug
          repositories: ossmosis,ASTL-confidential

      - name: Check out ossmosis
        uses: actions/checkout@v7
        with:
          repository: Arm-Debug/ossmosis
          path: ossmosis
          token: ${{ steps.ossmosis-token.outputs.token }}
          persist-credentials: false

      - name: Download confidential ossmosis manifest
        uses: actions/checkout@v7
        with:
          repository: Arm-Debug/ASTL-confidential
          path: ossmosis-config
          token: ${{ steps.ossmosis-token.outputs.token }}
          sparse-checkout: .ossmosis.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ossmosis
        run: python -m pip install ./ossmosis

      - name: Scan PR Snapshot
        working-directory: target
        run: |
          ossmosis scan \
            --root . \
            --manifest ../ossmosis-config/.ossmosis.json \
            --max-class public
