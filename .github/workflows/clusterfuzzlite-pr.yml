name: Fuzz testing

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".clusterfuzzlite/**"
      - ".dockerignore"
      - ".github/workflows/clusterfuzzlite-pr.yml"
      - ".gitignore"
      - ".trivyignore"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "config/**"
      - "fuzz/**"
      - "include/**"
      - "justfile"
      - "scripts/**"
      - "src/**"
      - "tools/mock_scmi/**"
      - "utils/**"
      - "vcpkg.json"
  workflow_dispatch:
    inputs:
      corpus-run-id:
        description: "Optional run ID containing a canonical-fuzz-corpus artifact (one directory per target)"
        type: string
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    # Code-change fuzzing is for PRs and explicit manual runs. Main pushes
    # refresh the coverage baseline without an additional mutation session.
    if: github.event_name != 'push'
    name: Public API targets (canonical profiles)
    runs-on: ubuntu-24.04
    # Allow cold image setup and compilation before the full mutation session.
    timeout-minutes: 30

    steps:
      - name: Record run metadata
        run: |
          mkdir -p "${RUNNER_TEMP}/astl-fuzz-results"
          {
            echo "astl_wrapper_validation_fuzzer=synthetic-wrapper"
            echo "astl_discovery_fuzzer=procfs"
            echo "astl_revision=${GITHUB_SHA}"
            echo "builder=gcr.io/oss-fuzz-base/base-builder:v1"
            echo "sanitizers=address,undefined"
          } >"${RUNNER_TEMP}/astl-fuzz-results/run-metadata.txt"

      - name: Build fuzz target
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          # The OSS-Fuzz bad-build check expects exactly the sanitizer named
          # below, while ASTL intentionally combines ASan and UBSan.
          bad-build-check: false
          language: c++
          github-token: ${{ secrets.GITHUB_TOKEN }}
          keep-unaffected-fuzz-targets: true
          sanitizer: address

      - name: Run fuzz target
        uses: docker://gcr.io/oss-fuzz-base/clusterfuzzlite-run-fuzzers:ubuntu-24-04-v1
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:symbolize=1
          CFL_PLATFORM: github
          FUZZ_SECONDS: 120
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANGUAGE: c++
          LOW_DISK_SPACE: "True"
          MINIMIZE_CRASHES: "True"
          MODE: code-change
          OUTPUT_SARIF: "False"
          REPORT_OOMS: "True"
          REPORT_TIMEOUTS: "True"
          SANITIZER: address
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

      - name: Upload run metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clusterfuzzlite-target-profiles-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/astl-fuzz-results/**
            build-out/compiler-version.txt
          retention-days: 10

  coverage:
    name: Canonical corpus line coverage
    # Independent of fuzz: retain coverage feedback even when mutation finds a crash.
    # Keep coverage.xml artifact-only, with fuzz results in the summary and badge.
    # GitHub Code Quality uploads would aggregate fuzz coverage into the test coverage merge gate.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download optional canonical evolved corpus
        if: inputs.corpus-run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: canonical-fuzz-corpus
          path: evolved-corpus
          run-id: ${{ inputs.corpus-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ClusterFuzzLite coverage image
        run: docker build -f .clusterfuzzlite/Dockerfile -t astl-fuzz-coverage .

      - name: Replay canonical corpora and generate reports
        env:
          ASTL_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          CORPUS_RUN_ID: ${{ inputs.corpus-run-id }}
        run: |
          mkdir -p coverage/fuzz
          corpus_args=()
          if [[ -n "$CORPUS_RUN_ID" ]]; then
            corpus_args=(-v "$PWD/evolved-corpus:/corpus:ro" -e ASTL_EVOLVED_CORPUS=/corpus)
          fi
          docker run --rm \
            -v "$PWD/coverage/fuzz:/report" \
            -e ASTL_REVISION -e SANITIZER=coverage -e OUT=/out \
            "${corpus_args[@]}" astl-fuzz-coverage bash -ceu '
              mkdir -p "$OUT"
              /usr/local/bin/compile
              corpus_args=()
              if [[ -n "${ASTL_EVOLVED_CORPUS:-}" ]]; then
                corpus_args=(--corpus "$ASTL_EVOLVED_CORPUS")
              fi
              python3 scripts/fuzz_coverage.py --bin-dir "$OUT" --output /report \
                --revision "$ASTL_REVISION" "${corpus_args[@]}"
            '
          cat coverage/fuzz/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload annotated source and uncovered-line data
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-coverage
          path: coverage/fuzz/
          if-no-files-found: error
          retention-days: 30
