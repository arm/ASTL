# Integration workflow to format, lint, build code on all supported platforms, and run tests.
# source for VCPKG goodness: https://github.com/lukka/CppCMakeVcpkgTemplate/blob/v11/.github/workflows/hosted-pure-workflow.yml
name: Integration

permissions:
  contents: read
  checks: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to true to terminate the jobs as soon as any one fails. set to false for debug
      fail-fast: true

      # Set up a matrix to run the following configurations:
      # - <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # - <Linux,   Debug,   latest GCC compiler toolchain on the default runner image, default generator>
      # - <Linux,   Debug,   latest Clang compiler toolchain on the default runner image, default generator>
      # - <MacOs,   Release, latest Clang compiler toolchain on the default runner image, default generator>
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        cmake_preset: [release, debug]
        cpp_compiler: [g++, clang++, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-15
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: ubuntu-latest
            cmake_preset: release
          - os: windows-latest
            cmake_preset: debug
          - os: windows-latest
            cpp_compiler: g++
          - os: windows-latest
            cpp_compiler: clang++
          - os: ubuntu-latest
            cpp_compiler: cl
          - os: macos-15
            cpp_compiler: cl
          - os: macos-15
            cpp_compiler: g++
          - os: macos-15
            cmake_preset: debug

    env:
      # Indicates the location of the vcpkg as a Git submodule of the project repository.
      # Not using "VCPKG_ROOT" because a variable with the same name is defined in the VS's
      # Developer Command Prompt environment in VS 2022 17.6, which would override this one
      # if it had the same name.
      _VCPKG_: ${{ github.workspace }}/vcpkg
      # Tells vcpkg where binary packages are stored.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg/bincache
      # Let's use GitHub Action cache as storage for the vcpkg Binary Caching feature.
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      # Set env variables needed for vcpkg to use GitHub Action cache for dependencies
      - name: 🌱 Set env vars
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Detect number of available cores for job parallelization
      - name: 🧠 Detect Core Count
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      - name: ⤵️ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch all history so we can git diff for clang-tidy relevant files
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      - name: ⤵️ Install apt-get Dependencies (ubuntu-latest)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr valgrind parallel

      - name: ⤵️ Install brew Dependencies (macos-15)
        if: matrix.os == 'macos-15'
        run: |
            brew update
            brew install llvm
            echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: 📂 VCPKG - Create VCPKG_DEFAULT_BINARY_CACHE directory
        run: mkdir -p $VCPKG_DEFAULT_BINARY_CACHE
        shell: bash

      # Restore vcpkg from the GitHub Action cache service. Note that packages are restored by vcpkg's binary caching
      # when it is being run afterwards by CMake.
      - name: ⤵️ VCPKG - Restore Cache
        uses: actions/cache@v4
        with:
          # The first path is the location of vcpkg: it contains the vcpkg executable and data files, as long as the
          # built package archives (aka binary cache) which are located by VCPKG_DEFAULT_BINARY_CACHE env var.
          # The other paths starting with '!' are exclusions: they contain temporary files generated during the build of the installed packages.
          path: |
            ${{ env._VCPKG_ }}
            !${{ env._VCPKG_ }}/buildtrees
            !${{ env._VCPKG_ }}/packages
            !${{ env._VCPKG_ }}/downloads
            !${{ env._VCPKG_ }}/installed
          # The key is composed in a way that it gets properly invalidated whenever a different version of vcpkg is being used.
          key: |
            os-${{ matrix.os }}-compiler${{ matrix.cpp_compiler }}-${{ hashFiles( '.git/modules/vcpkg/HEAD' )}}-vcpkg.json

      - name: ⤵️ VCPKG - Install Dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: ⚙️ CMake - Configure
        if: matrix.os != 'macos-15'
        # Configure CMake in a 'build' subdirectory.
        run: >
          cmake
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -S ${{ github.workspace }}
          --preset ${{ matrix.cmake_preset }}

      - name: ⚙️ CMake - Configure (macos-15)
        if: matrix.os == 'macos-15'
        # Configure CMake in a 'build' subdirectory.
        # don't use the matrix strategy compiler
        # just the runner default detected compiler for cmake works best for c++23 compatibility
        run: >
          cmake
          -S ${{ github.workspace }}
          --preset ${{ matrix.cmake_preset }}

      - name: 🏗️ CMake - Build
        # Build ASTL library with the given configuration.
        # Note that --preset is needed because the default Windows generator
        # is a multi-config generator (Visual Studio generator).
        run: cmake --build --parallel=${{ steps.cpu-cores.outputs.count }} --preset ${{ matrix.cmake_preset }} --verbose

      - name: 🧪 CMake - Run Unit Tests and Generate Code Coverage (ubuntu-latest)
        if: matrix.os == 'ubuntu-latest'
        # Execute tests defined by the CMake configuration.
        # Note that --preset is needed because the default Windows generator
        # is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        # exclude sample tests - we want to measure coverage of tests that have assertions in them
        run: |
          if [[ ${{ matrix.cmake_preset }} == 'debug' ]]; then
            echo 'Running unit tests with Valgrind'
            valgrind --version
            ctest --parallel ${{ steps.cpu-cores.outputs.count }} -LE "integration|time_sensitive|mocksysfs" -T memcheck --test-dir ${{ github.workspace }}/build/${{ matrix.cmake_preset }} --preset ${{ matrix.cmake_preset }}
            # echo 'Running MockSysfs without parallelization.  Need proper fix.'
            # ctest -L "mocksysfs" -T memcheck --test-dir ${{ github.workspace }}/build/${{ matrix.cmake_preset }} --preset ${{ matrix.cmake_preset }}
            echo 'Running time_sensitive tests without parallelization or memcheck.'
            ctest -L "time_sensitive" --test-dir ${{ github.workspace }}/build/${{ matrix.cmake_preset }} --preset ${{ matrix.cmake_preset }}

            # Grep will return a non-zero exit code if the defect list is non-empty and cause the CICD flow to fail
            grep -F '<DefectList/>' ${{ github.workspace }}/build/${{ matrix.cmake_preset }}/Testing/*/DynamicAnalysis.xml
          else
            echo 'Skipping Valgrind for unit tests'
            ctest --parallel ${{ steps.cpu-cores.outputs.count }} -LE "integration|time_sensitive|mocksysfs" --preset ${{ matrix.cmake_preset }}
            # echo 'Running MockSysfs without parallelization.  Need proper fix.'
            # ctest -L "mocksysfs" --preset ${{ matrix.cmake_preset }}
            echo 'Running time_sensitive tests without parallelization.'
            ctest -L "time_sensitive" --test-dir ${{ github.workspace }}/build/${{ matrix.cmake_preset }} --preset ${{ matrix.cmake_preset }}
          fi

      - name: 📊 Code Coverage - Merge Coverage from Parallel Runs
        if: matrix.os == 'ubuntu-latest' && matrix.c_compiler == 'gcc' && matrix.cmake_preset == 'debug'
        run: ${{ github.workspace }}/scripts/merge_coverage.sh ${{ github.workspace }}/build

      - name: 📊 Code Coverage - Generate Report with gcovr
        if: matrix.os == 'ubuntu-latest' && matrix.c_compiler == 'gcc' && matrix.cmake_preset == 'debug'
        run: ${{ github.workspace }}/scripts/create_coverage_report.sh --xml

      - name: ⤴️ Code Coverage - Publish to Qlty
        # project overview: https://qlty.sh/gh/Arm-Debug/projects/ASTL
        if: matrix.os == 'ubuntu-latest' && matrix.c_compiler == 'gcc' && matrix.cmake_preset == 'debug'
        uses: qltysh/qlty-action/coverage@v1
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.xml

      - name: 🧪 Run Sample tests
        # Execute tests defined by the CMake configuration.
        # Note that --preset is needed because the default Windows generator
        # is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        # include only sample tests, we skipped these earlier in `Unit tests`
        # because we don't want to include them for coverage.
        run: ctest -L "integration" --preset ${{ matrix.cmake_preset }}
