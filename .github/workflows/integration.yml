# Integration workflow to format, lint, build code on all supported platforms, and run tests.
# source for VCPKG goodness: https://github.com/lukka/CppCMakeVcpkgTemplate/blob/v11/.github/workflows/hosted-pure-workflow.yml
name: Integration

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Runs daily at 09:14 UTC = 03:14 CST
    - cron: "14 9 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  checks: write
  code-quality: write  # required by code coverage to upload code coverage data
  pull-requests: read  # required by the code coverage upload to identify pr number

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to true to terminate the jobs as soon as any one fails. set to false for debug
      fail-fast: false

      # Set up a matrix to run the following configurations, which split some of the test responsibility
      matrix:
        include:
          - os: windows-2022
            cmake_preset: windows-release
            c_compiler: cl
            cpp_compiler: cl

          # Collect code coverage from unit tests and upload it to GitHub and qlty.io.
          - os: ubuntu-24.04-arm
            cmake_preset: debug-valgrind-coverage
            c_compiler: gcc
            cpp_compiler: g++

          # Run Go tests.
          - os: ubuntu-24.04-arm
            cmake_preset: release
            c_compiler: clang
            cpp_compiler: clang++

          - os: macos-15
            cmake_preset: release
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      # Checkout MUST happen before calling local composite action
      - name: ⤵️ Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      # ===== BUILD STEPS (calls composite action) =====
      - name: 🏗️ Build ASTL
        uses: ./.github/actions/build
        with:
          os: ${{ matrix.os }}
          cmake_preset: ${{ matrix.cmake_preset }}
          c_compiler: ${{ matrix.c_compiler }}
          cpp_compiler: ${{ matrix.cpp_compiler }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ===== TEST STEPS =====
      - name: 🐹 Setup Go
        if: contains(matrix.os, 'ubuntu') && matrix.c_compiler == 'clang' && matrix.cmake_preset == 'release'
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"

      - name: 🐹 Run Go Wrapper Smoke Tests
        if: contains(matrix.os, 'ubuntu') && matrix.c_compiler == 'clang' && matrix.cmake_preset == 'release'
        run: |
          ASTL_HOST_ARCH="$("${{ github.workspace }}/scripts/host_arch.sh")"
          ASTL_INCLUDE_DIR="${{ github.workspace }}/build/${{ matrix.cmake_preset }}/include"
          ASTL_LIB_DIR="${{ github.workspace }}/build/${{ matrix.cmake_preset }}/${ASTL_HOST_ARCH}/lib"
          export CGO_CFLAGS="-I${ASTL_INCLUDE_DIR}"
          export CGO_LDFLAGS="-L${ASTL_LIB_DIR} -Wl,-rpath,${ASTL_LIB_DIR} -lastl-0"
          export LD_LIBRARY_PATH="${ASTL_LIB_DIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd ${{ github.workspace }}/Go
          go test ./...

      - name: 🧪 CMake - Run Unit Tests and Generate Code Coverage
        if: contains(matrix.os, 'ubuntu')
        # Execute tests defined by the CMake configuration.
        # Note that --preset is needed because the default Windows generator
        # is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        # exclude sample tests - we want to measure coverage of tests that have assertions in them
        run: |
          MEMCHECK_PARAMS=()
          if [[ "${CMAKE_PRESET}" == "debug-valgrind-coverage" ]]; then
            echo 'Running unit tests with Valgrind.'
            valgrind --version
            MEMCHECK_PARAMS=(--test-action memcheck)
          else
            echo 'Running unit tests without Valgrind.'
          fi

          ctest --parallel -LE "integration|time_sensitive" "${MEMCHECK_PARAMS[@]}" --test-dir ${{ github.workspace }}/build/${{ matrix.cmake_preset }} --preset ${{ matrix.cmake_preset }}
          echo 'Running time_sensitive tests without parallelization or memcheck.'
          ctest -L "time_sensitive" --test-dir ${{ github.workspace }}/build/${{ matrix.cmake_preset }} --preset ${{ matrix.cmake_preset }}

          if [[ ${#MEMCHECK_PARAMS[@]} -gt 0 ]]; then
            echo 'Checking valgrind output for memory issues'
            # Grep will return a non-zero exit code if the defect list is non-empty and cause the CICD flow to fail
            grep -F '<DefectList/>' ${{ github.workspace }}/build/${{ matrix.cmake_preset }}/Testing/*/DynamicAnalysis.xml
          fi
        env:
          CMAKE_PRESET: ${{  matrix.cmake_preset }}

      - name: ⤴️ Upload Valgrind Logs
        if: always() && contains(matrix.os, 'ubuntu') && matrix.cmake_preset == 'debug-valgrind-coverage'
        uses: actions/upload-artifact@v7
        with:
          name: valgrind-logs-${{ matrix.os }}-${{ matrix.cpp_compiler }}
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/build/${{ matrix.cmake_preset }}/Testing/**/DynamicAnalysis.xml
            ${{ github.workspace }}/build/${{ matrix.cmake_preset }}/Testing/Temporary/LastDynamicAnalysis*.log*
            ${{ github.workspace }}/build/${{ matrix.cmake_preset }}/Testing/Temporary/MemoryChecker.*.log

      - name: 🧪 Run ScmiBridge Coverage Tests
        if: contains(matrix.os, 'ubuntu') && matrix.c_compiler == 'gcc' && matrix.cmake_preset == 'debug-valgrind-coverage'
        run: ctest -L "scmi_bridge" --test-dir ${{ github.workspace }}/build/${{ matrix.cmake_preset }} --preset ${{ matrix.cmake_preset }}

      - name: 📊 Code Coverage - Merge Coverage from Parallel Runs
        if: contains(matrix.os, 'ubuntu') && matrix.c_compiler == 'gcc' && matrix.cmake_preset == 'debug-valgrind-coverage'
        run: ${{ github.workspace }}/scripts/merge_coverage.sh ${{ github.workspace }}/build

      - name: 📊 Code Coverage - Generate Report with gcovr
        if: contains(matrix.os, 'ubuntu') && matrix.c_compiler == 'gcc' && matrix.cmake_preset == 'debug-valgrind-coverage'
        run: ${{ github.workspace }}/scripts/create_coverage_report.sh --xml

      - name: Qlty Token Exists?
        id: qlty-token
        shell: bash
        run: |
          if [ "${{ secrets.QLTY_COVERAGE_TOKEN }}" != "" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: ⤴️ Code Coverage - Publish to Qlty
        # project overview: https://qlty.sh/gh/Arm-Debug/projects/ASTL
        if: contains(matrix.os, 'ubuntu') && matrix.c_compiler == 'gcc' && matrix.cmake_preset == 'debug-valgrind-coverage' && steps.qlty-token.outputs.exists == 'true'
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.xml

      - name: ⤴️ Code Coverage - Publish to GitHub
        # publish only coverage data from one build configuration
        # also permit this upload from PRs in the repo but not from forks.
        if: >-
          contains(matrix.os, 'ubuntu') &&
          matrix.c_compiler == 'gcc' &&
          matrix.cmake_preset == 'debug-valgrind-coverage' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: C++
          label: code-coverage/gcovr

      - name: 🧪 Run Sample tests
        # Execute tests defined by the CMake configuration.
        # Note that --preset is needed because the default Windows generator
        # is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        # include only sample tests, we skipped these earlier in `Unit tests`
        # because we don't want to include them for coverage.
        run: ctest -L "integration" --preset ${{ matrix.cmake_preset }}
