# Integration workflow to format, lint, build code on all supported platforms, and run tests.
# source for VCPKG goodness: https://github.com/lukka/CppCMakeVcpkgTemplate/blob/v11/.github/workflows/hosted-pure-workflow.yml
name: Integration

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Runs daily at 09:14 UTC = 03:14 CST
    - cron: "14 9 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  checks: write
  # required by code coverage to upload code coverage data
  code-quality: write
  # required by the code coverage upload to identify pr number
  pull-requests: read

# run this workflow serially for each PR. Cancel stale runs. fall back on github.ref if non-PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-ubuntu-dependencies:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 🔑 Create source checkout token
        id: source-checkout-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APAP_APP_APP_ID }}
          private-key: ${{ secrets.APAP_APP_PRIVATE_KEY }}
          owner: Arm-Debug
          repositories: ASTL,mock-SCMI
          permission-contents: read

      - name: ⤵️ Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ steps.source-checkout-token.outputs.token }}
          submodules: true

      - name: ⤵️ Install vcpkg toolchain
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y gcc g++ cmake

      # Hosted Arm64 lint and integration share this standard-triplet archive.
      - name: ⤵️ Restore Ubuntu vcpkg binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-binary-cache
        with:
          cohort: hosted-arm64-linux
          compiler: gcc

      - name: 🏗️ Populate Ubuntu vcpkg binaries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/build
        with:
          os: ubuntu-24.04-arm
          cmake_preset: release
          c_compiler: clang
          cpp_compiler: clang++
          vcpkg_cache_path: ${{ steps.vcpkg-cache.outputs.path }}
          configure_only: "true"

      - name: ⤴️ Save Ubuntu vcpkg binaries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: ${{ steps.vcpkg-cache.outputs.key }}

      # Pass the prepared binaries through this run's artifact service. The
      # three Ubuntu jobs then avoid separate cache-service download requests.
      - name: ⤴️ Upload Ubuntu vcpkg binaries
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-vcpkg-binaries
          path: .vcpkg-cache/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-and-test:
    needs: prepare-ubuntu-dependencies
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to true to terminate the jobs as soon as any one fails. set to false for debug
      fail-fast: false

      # Set up a matrix to run the following configurations, which split some of the test responsibility
      matrix:
        include:
          - os: windows-2022
            cmake_preset: windows-release
            c_compiler: cl
            cpp_compiler: cl

          # Collect code coverage from unit tests and upload it to GitHub
          - os: ubuntu-24.04-arm
            cmake_preset: debug-coverage
            c_compiler: gcc
            cpp_compiler: g++

          # Run memory checks in sharded test suites without coverage instrumentation.
          - os: ubuntu-24.04-arm
            cmake_preset: debug-valgrind
            c_compiler: gcc
            cpp_compiler: g++

          # Run Go tests.
          - os: ubuntu-24.04-arm
            cmake_preset: release
            c_compiler: clang
            cpp_compiler: clang++

          - os: macos-15
            cmake_preset: release
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - name: 🔑 Create source checkout token
        id: source-checkout-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APAP_APP_APP_ID }}
          private-key: ${{ secrets.APAP_APP_PRIVATE_KEY }}
          owner: Arm-Debug
          repositories: ASTL,mock-SCMI
          permission-contents: read

      # Checkout MUST happen before calling local composite action
      - name: ⤵️ Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ steps.source-checkout-token.outputs.token }}
          submodules: true

      - name: ⤵️ Download Ubuntu vcpkg binaries
        if: contains(matrix.os, 'ubuntu')
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-vcpkg-binaries
          path: .vcpkg-cache

      # Refresh the archive when a hosted image changes its compiler or build tools.
      - name: 🧠 Detect runner image version
        if: matrix.os != 'ubuntu-24.04-arm'
        id: runner_image
        shell: bash
        run: echo "version=${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: ⤵️ Restore Windows and macOS vcpkg binaries
        if: matrix.os != 'ubuntu-24.04-arm'
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.os }}-v2-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/**', 'cmake/toolchains/**') }}-${{ steps.runner_image.outputs.version }}
          restore-keys: vcpkg-${{ matrix.os }}-v2-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/**', 'cmake/toolchains/**') }}-
        continue-on-error: true

      # ===== BUILD STEPS (calls composite action) =====
      - name: 🏗️ Build ASTL
        uses: ./.github/actions/build
        with:
          os: ${{ matrix.os }}
          cmake_preset: ${{ matrix.cmake_preset }}
          c_compiler: ${{ matrix.c_compiler }}
          cpp_compiler: ${{ matrix.cpp_compiler }}
          vcpkg_cache_path: ${{ github.workspace }}/.vcpkg-cache

      # ===== TEST STEPS =====
      - name: 🐹 Setup Go
        if: contains(matrix.os, 'ubuntu') && matrix.c_compiler == 'clang' && matrix.cmake_preset == 'release'
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"

      - name: 🐹 Run Go Wrapper Smoke Tests
        if: contains(matrix.os, 'ubuntu') && matrix.c_compiler == 'clang' && matrix.cmake_preset == 'release'
        run: |
          ASTL_HOST_ARCH="$("${{ github.workspace }}/scripts/host_arch.sh")"
          ASTL_INCLUDE_DIR="${{ github.workspace }}/build/${{ matrix.cmake_preset }}/include"
          ASTL_LIB_DIR="${{ github.workspace }}/build/${{ matrix.cmake_preset }}/${ASTL_HOST_ARCH}/lib"
          export CGO_CFLAGS="-I${ASTL_INCLUDE_DIR}"
          export CGO_LDFLAGS="-L${ASTL_LIB_DIR} -Wl,-rpath,${ASTL_LIB_DIR} -lastl-0"
          export LD_LIBRARY_PATH="${ASTL_LIB_DIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd ${{ github.workspace }}/Go
          go test ./...

      - name: 🧪 CMake - Run Unit Tests Without Valgrind
        if: contains(matrix.os, 'ubuntu') && matrix.cmake_preset != 'debug-valgrind'
        # Execute tests defined by the CMake configuration.
        # Note that --preset is needed because the default Windows generator
        # is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        # Exclude sample tests; coverage should measure tests that have assertions in them.
        run: |
          # Run ordinary tests in parallel, then tests that use timing or shared
          # process-wide resources individually. Integration tests run in their
          # dedicated step below.
          # Coverage registers ordinary Catch2 cases as a few suite shards;
          # isolated cases and non-Catch2 smoke tests remain individual tests.
          ctest --parallel 4 -LE "integration|time_sensitive|valgrind_isolated|^valgrind$" --test-dir ${{ github.workspace }}/build/${{ matrix.cmake_preset }} --preset ${{ matrix.cmake_preset }}
          ctest --parallel 1 -L "time_sensitive|valgrind_isolated" -LE "integration" --test-dir ${{ github.workspace }}/build/${{ matrix.cmake_preset }} --preset ${{ matrix.cmake_preset }}

      - name: 🧪 CMake - Run Sharded Unit Tests With Valgrind
        if: contains(matrix.os, 'ubuntu') && matrix.cmake_preset == 'debug-valgrind'
        run: |
          valgrind --version
          # Run the suite-level shards with bounded concurrency. Tests tagged
          # valgrind_isolated or time_sensitive are excluded by each shard's
          # Catch2 filter and run without Memcheck in the ordinary test jobs.
          ctest --parallel 4 -L "valgrind" --test-action memcheck --test-dir ${{ github.workspace }}/build/${{ matrix.cmake_preset }} --preset ${{ matrix.cmake_preset }}
          echo 'Checking Valgrind output for memory issues.'
          # Grep returns non-zero for a non-empty defect list and fails the CI job.
          grep -F '<DefectList/>' ${{ github.workspace }}/build/${{ matrix.cmake_preset }}/Testing/*/DynamicAnalysis.xml

      - name: ⤴️ Upload Valgrind Logs
        if: always() && contains(matrix.os, 'ubuntu') && matrix.cmake_preset == 'debug-valgrind'
        uses: actions/upload-artifact@v7
        with:
          name: valgrind-logs-${{ matrix.os }}-${{ matrix.cpp_compiler }}
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/build/${{ matrix.cmake_preset }}/Testing/**/DynamicAnalysis.xml
            ${{ github.workspace }}/build/${{ matrix.cmake_preset }}/Testing/Temporary/LastDynamicAnalysis*.log*
            ${{ github.workspace }}/build/${{ matrix.cmake_preset }}/Testing/Temporary/MemoryChecker.*.log

      - name: 📊 Code Coverage - Merge Coverage from Parallel Runs
        if: contains(matrix.os, 'ubuntu') && matrix.c_compiler == 'gcc' && matrix.cmake_preset == 'debug-coverage'
        run: ${{ github.workspace }}/scripts/merge_coverage.sh ${{ github.workspace }}/build/${{ matrix.cmake_preset }}

      - name: 📊 Code Coverage - Generate Report with gcovr
        if: contains(matrix.os, 'ubuntu') && matrix.c_compiler == 'gcc' && matrix.cmake_preset == 'debug-coverage'
        run: ${{ github.workspace }}/scripts/create_coverage_report.sh --xml

      - name: 🧪 Verify coverage shard partition
        if: matrix.cmake_preset == 'debug-coverage'
        # Listing cases runs instrumented binaries too. Validate after the report
        # is finalized so listing-only profiles cannot affect measured coverage.
        run: python3 scripts/check_coverage_shards.py build/${{ matrix.cmake_preset }}

      - name: ⤴️ Code Coverage - Publish to GitHub
        # publish only coverage data from one build configuration
        # also permit this upload from PRs in the repo but not from forks.
        if: >-
          contains(matrix.os, 'ubuntu') &&
          matrix.c_compiler == 'gcc' &&
          matrix.cmake_preset == 'debug-coverage' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: C++
          label: code-coverage/gcovr

      - name: 🧪 Run Sample tests
        if: matrix.cmake_preset != 'debug-valgrind'
        # Execute tests defined by the CMake configuration.
        # Note that --preset is needed because the default Windows generator
        # is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        # include only sample tests, we skipped these earlier in `Unit tests`
        # because we don't want to include them for coverage.
        run: ctest -L "integration" --preset ${{ matrix.cmake_preset }}

  sanitizer:
    name: ASan + UBSan (Ubuntu)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      # TODO - remove this step one mock-SCMI is available from Arm/mock-SCMI OSS repo
      - name: 🔑 Create source checkout token
        id: source-checkout-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APAP_APP_APP_ID }}
          private-key: ${{ secrets.APAP_APP_PRIVATE_KEY }}
          owner: Arm-Debug
          repositories: ASTL,mock-SCMI
          permission-contents: read

      - name: ⤵️ Checkout ASTL
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          # TODO - once mock-SCMI is available from Arm/mock-SCMI OSS repo, we can use secrets.GITHUB_TOKEN
          token: ${{ steps.source-checkout-token.outputs.token }}
          submodules: true
          persist-credentials: false

      - name: ⤵️ Install sanitizer toolchain
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y clang-20 cmake

      - name: ⤵️ Restore sanitizer vcpkg binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-binary-cache
        with:
          cohort: hosted-arm64-linux-asan-ubsan
          compiler: clang-20

      - name: 🏗️ Build ASTL with ASan and UBSan
        uses: ./.github/actions/build
        with:
          os: ubuntu-24.04-arm
          cmake_preset: debug-asan-ubsan
          c_compiler: clang
          cpp_compiler: clang++
          vcpkg_cache_path: ${{ steps.vcpkg-cache.outputs.path }}

      - name: ⤴️ Save sanitizer vcpkg binaries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: ${{ steps.vcpkg-cache.outputs.key }}

      - name: ⤵️ Install just
        run: sudo apt-get -o DPkg::Lock::Timeout=300 install -y just

      - name: 🧪 Run deterministic sanitizer tests
        run: just sanitizer debug-asan-ubsan

      - name: ⤴️ Upload sanitizer logs and test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-logs-ubuntu-clang
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/build/debug-asan-ubsan/sanitizer-logs/**
            ${{ github.workspace }}/build/debug-asan-ubsan/test-results/**
            ${{ github.workspace }}/build/debug-asan-ubsan/Testing/Temporary/LastTest.log
            ${{ github.workspace }}/build/debug-asan-ubsan/CMakeFiles/CMakeConfigureLog.yaml
