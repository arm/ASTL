name: Python CI

# Minimal default GITHUB_TOKEN permissions (principle of least privilege).
# Individual jobs inherit this unless they need elevation.
permissions:
  contents: read

on:
  push:
    branches: [main] # Production / release branch
  pull_request:
  schedule:
    # Runs daily at 09:14 UTC = 03:14 CST
    - cron: "14 9 * * *"
  workflow_dispatch:

jobs:
  build-native:
    # Single native C++ build reused by all Python matrix jobs.
    runs-on: self-hosted-ubuntu-24.04-arm64
    # Minimal permissions; only needs read access.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tooling
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update -y
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y build-essential cmake cppcheck just libsensors-dev ninja-build pkg-config python3 python3-pip

      - name: Configure & build (debug preset)
        run: |
          # Remove stale Cython artifacts from previous runs on this persistent runner
          rm -f python/astl/_core.cpython-*.so python/astl/_core.cpp
          # Configure and build once. This produces build/debug/lib/libastl-<MAJOR>d.so
          just config debug
          just build debug

      - name: Upload native artifact (library + generated headers)
        uses: actions/upload-artifact@v7
        with:
          name: astl-native-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/debug/lib/libastl-*.so
            build/debug/include/**
            build/debug/compile_commands.json
          retention-days: 7

  build-test:
    needs: build-native
    runs-on: self-hosted-ubuntu-24.04-arm64
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: astl-native-${{ github.sha }}
          path: native-artifact
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Prepare native artifact layout
        run: |
          set -euo pipefail
          mkdir -p build/debug/lib build/debug/include
          # Move shared library(s) into expected location (search recursively to handle nested paths)
          find native-artifact -type f -name 'libastl-*.so' -exec cp {} build/debug/lib/ \; || true
          # If multiple variants somehow exist, list them
          echo "[ci] Discovered libastl variants:"; ls -1 build/debug/lib || true
          # Preserve generated headers (version, etc.)
          if [ -d native-artifact/build/debug/include ]; then
            cp -r native-artifact/build/debug/include/* build/debug/include/ || true
          else
            # older upload layout: include/** directly under artifact root
            if [ -d native-artifact/include ]; then
              cp -r native-artifact/include/* build/debug/include/ || true
            fi
          fi
          echo "[ci] Native artifact contents:"; ls -1 build/debug/lib || true
      - name: Install deps & run reuse tests
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          sudo apt-get -o DPkg::Lock::Timeout=300 update -y
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y just
          just python-reuse-tests
        env:
          ASTL_DISABLE_NATIVE_FALLBACK: "1"
      - name: Tests (pytest + mypy)
        run: echo "[tests] Already executed within python-reuse-tests recipe"

  package-and-benchmark:
    # Guard clause: only run on Python 3.12 context (single job instead of many step-level ifs)
    needs: [build-native, build-test]
    # Run only for scheduled (cron) executions and when upstream succeeded
    if: github.event_name == 'schedule' && !cancelled() && needs.build-test.result == 'success'
    runs-on: self-hosted-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: astl-native-${{ github.sha }}
          path: .
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          sudo apt-get -o DPkg::Lock::Timeout=300 update -y
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y just
      - name: Build sdist & wheel
        run: |
          set -euo pipefail
          just python-package-and-benchmark
      - name: Collect artifacts (already created by recipe)
        run: |
          test -f python/dist/$(ls -1 python/dist/ | head -n1) || { echo "[package] missing dist artifacts" >&2; exit 5; }
          test -f benchmark_metrics.json || echo '{}' > benchmark_metrics.json
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: astl-dist-${{ github.sha }}
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.sha }}
          path: |
            benchmark_metrics.json
            benchmark_output.log

  python-full-cycle:
    runs-on: self-hosted-ubuntu-24.04
    needs: build-test
    # Restrict to scheduled (cron) runs only when build-test succeeded
    if: github.event_name == 'schedule' && !cancelled() && needs.build-test.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install just
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update -y
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y just

      - name: Run python-full-cycle recipe
        run: |
          just python-full-cycle
