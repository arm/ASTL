name: Integration with Overlay

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Runs daily at 09:19 UTC = 03:19 CST
    - cron: "19 9 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build and test with confidential overlay
    if: >-
      github.repository_owner == 'Arm-Debug' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: ⤵️ Checkout ASTL
        uses: actions/checkout@v7
        with:
          path: ASTL
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true
          persist-credentials: false

      - name: 🧩 Prepare confidential overlay
        uses: ./ASTL/.github/actions/confidential-overlay
        with:
          client_id: ${{ secrets.APAP_APP_APP_ID }}
          private_key: ${{ secrets.APAP_APP_PRIVATE_KEY }}
          source_dir: ${{ github.workspace }}/ASTL

      - name: 🏗️ Build ASTL
        uses: ./ASTL/.github/actions/build
        with:
          os: ubuntu-24.04-arm
          cmake_preset: release
          c_compiler: gcc
          cpp_compiler: g++
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_dir: ${{ github.workspace }}/ASTL

      - name: 🧪 Run unit tests
        working-directory: ASTL
        run: |
          # basic ctest args used for parallel or serial config. specify the dir with tests and which build preset to use
          CTEST_ARGS=(--test-dir ${{ github.workspace }}/build/release --preset release)

          # those test labels that can't be run in parallel (might be worth making a special label for these)
          # mostly these involve setting up some infrastructure like mock scmi
          # that can't be done twice in parallel due to contention over /dev/fuse or some such.
          UNPARALLELED_LABELS="integration|time_sensitive|scmi_bridge|mockscmi"

          # run as much in parallel as possible, but exclude the tests that can't be run in parallel
          ctest --parallel -LE "${UNPARALLELED_LABELS}" "${CTEST_ARGS[@]}"
          # run the tests that can't be run in parallel
          ctest -L "${UNPARALLELED_LABELS}" "${CTEST_ARGS[@]}"

      - name: 📽️ Run demo with MockScmi
        working-directory: ASTL
        run: |
          set -o pipefail
          EXPECTED_STRING="astlGetMetricSamplesOnTarget Status: SUCCESS"
          ASTL_BUILD_PRESET=release ./scripts/demo.sh > demo.log
          cat demo.log
          grep "${EXPECTED_STRING}" demo.log
        env:
          ASTL_LOG_LEVEL: "DEBUG"
          ASTL_LOG_CONSOLE: 1

  static-atx:
    name: Fully static ATX
    if: >-
      github.repository_owner == 'Arm-Debug' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: ⤵️ Checkout ASTL
        uses: actions/checkout@v7
        with:
          path: ASTL
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true
          persist-credentials: false

      - name: 🧩 Prepare confidential overlay
        uses: ./ASTL/.github/actions/confidential-overlay
        with:
          client_id: ${{ secrets.APAP_APP_APP_ID }}
          private_key: ${{ secrets.APAP_APP_PRIVATE_KEY }}
          source_dir: ${{ github.workspace }}/ASTL

      - name: 🏗️ Build fully static ATX
        uses: ./ASTL/.github/actions/build
        with:
          os: ubuntu-24.04-arm
          cmake_preset: release
          c_compiler: gcc
          cpp_compiler: g++
          github_token: ${{ secrets.GITHUB_TOKEN }}
          atx_static_link: true
          source_dir: ${{ github.workspace }}/ASTL

      - name: 🧪 Verify fully static ATX
        shell: bash
        working-directory: ASTL
        run: |
          ASTL_BUILD_ARCH="$(./scripts/host_arch.sh)"
          ATX_BINARY="${{ github.workspace }}/ASTL/build/release/${ASTL_BUILD_ARCH}/bin/atx-static"
          ./scripts/verify_static_executable.sh "${ATX_BINARY}"
          "${ATX_BINARY}" --version
