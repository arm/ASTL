name: CentOS Stream 10 Compatibility

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream10

    steps:
      - name: ⤵️ Install build dependencies
        shell: bash
        run: |
          dnf install -y \
            ca-certificates \
            cmake \
            curl \
            gcc \
            gcc-c++ \
            git \
            jq \
            make \
            pkgconf-pkg-config \
            python3 \
            tar \
            unzip \
            zip

      - name: 🔑 Create source checkout token
        id: source-checkout-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APAP_APP_APP_ID }}
          private-key: ${{ secrets.APAP_APP_PRIVATE_KEY }}
          owner: Arm-Debug
          repositories: ASTL,mock-SCMI
          permission-contents: read

      - name: ⤵️ Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.source-checkout-token.outputs.token }}
          submodules: true

      - name: ⚙️ CMake - Configure
        shell: bash
        run: |
          cmake --version
          cmake --preset debug-make

      - name: 🏗️ CMake - Build
        shell: bash
        run: cmake --build --preset debug-make --parallel "$(nproc)" --verbose

      - name: 🧪 CTest - Non-integration tests
        shell: bash
        run: ctest -LE "integration|time_sensitive" --preset debug-make

      - name: 🧪 CTest - Time-sensitive tests
        shell: bash
        run: ctest -L "time_sensitive" --preset debug-make
