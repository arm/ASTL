name: Release

permissions:
  actions: write
  contents: write
  checks: write

on:
  schedule:
    # Runs daily at 09:14 UTC = 03:14 CST
    # This flow doesn't make a publicly visible release, it just publishes internally
    # This ensures that issues are caught early.
    - cron: "14 9 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "ASTL release-candidate tag or commit (defaults to the dispatched commit)"
        required: false
        type: string
      release_type:
        description: "Publish a rolling build or an already-prepared stable release"
        required: true
        default: "ROLLING"
        type: choice
        options:
          - ROLLING
          - STABLE
  workflow_call:
    inputs:
      source_ref:
        description: "ASTL release-candidate tag or commit"
        required: true
        type: string
      release_type:
        description: "Publish a rolling build or an already-prepared stable release"
        required: true
        type: string
    secrets:
      APAP_APP_APP_ID:
        required: true
      APAP_APP_PRIVATE_KEY:
        required: true
      ITS_ARTIFACTORY_ARM_KEY:
        required: true
    outputs:
      source_sha:
        description: "Resolved immutable ASTL source commit"
        value: ${{ jobs.release.outputs.source_sha }}
      version:
        description: "Published ASTL version"
        value: ${{ jobs.release.outputs.version }}
      tag_name:
        description: "Published ASTL release tag"
        value: ${{ jobs.release.outputs.tag_name }}

concurrency:
  # Cancel currently running release workflow if a new one is triggered
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ matrix.os }}
    outputs:
      source_sha: ${{ steps.source-metadata.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.set_tag_output.outputs.tag_name }}

    strategy:
      # Set fail-fast to true to terminate the jobs as soon as any one fails. set to false for debug
      fail-fast: false

      matrix:
        # Artifactory can only be accessed from within the ARM network, so only run on self-hosted runners
        # Refactor: split the artifactory upload into its own workflow so the bulk of this flow can run on any runner (ubuntu-latest)
        os: [self-hosted-ubuntu-24.04-arm64]
        # os: [ubuntu-latest]
        c_compiler: [gcc]
        cpp_compiler: [g++]
    env:
      ASTL_REPOSITORY: Arm-Debug/ASTL
      RELEASE_TYPE: ${{ inputs.release_type || 'ROLLING' }}
      SOURCE_REF: ${{ inputs.source_ref || github.sha }}

    steps:
      - name: 🔑 Create source checkout token
        id: source-checkout-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APAP_APP_APP_ID }}
          private-key: ${{ secrets.APAP_APP_PRIVATE_KEY }}
          owner: Arm-Debug
          repositories: ASTL,mock-SCMI
          permission-contents: write
          permission-pull-requests: write

      # Checkout MUST happen before calling local composite action
      - name: ⤵️ Checkout code
        uses: actions/checkout@v7
        with:
          repository: Arm-Debug/ASTL
          path: ASTL
          fetch-depth: 0
          ref: ${{ env.SOURCE_REF }}
          token: ${{ steps.source-checkout-token.outputs.token }}
          submodules: true

      - name: 📌 Record immutable ASTL source
        id: source-metadata
        shell: bash
        working-directory: ${{ github.workspace }}/ASTL
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_IS_MAIN="false"
          if git merge-base --is-ancestor "${SOURCE_SHA}" origin/main; then
            SOURCE_IS_MAIN="true"
          fi
          echo "sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "is_main=${SOURCE_IS_MAIN}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ASTL ${SOURCE_SHA} from ${SOURCE_REF}."

      - name: ⤵️ Install apt-get Dependencies (ubuntu)
        if: contains(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y clang-20 tree zip gh

      - name: 📈 Determine Final Version String
        id: version
        shell: bash
        run: |
          SOURCE_VERSION_STRING="$(head -n 1 "${{ github.workspace }}/ASTL/VERSION.md")"
          echo "SOURCE_VERSION_STRING=${SOURCE_VERSION_STRING}"
          if [[ "${RELEASE_TYPE}" == "STABLE" ]]; then
            if [[ "${SOURCE_VERSION_STRING}" == *.post ]]; then
              echo "Stable releases require a prepared VERSION.md without a .post suffix." >&2
              echo "Run the Prepare Release workflow and merge its PR first." >&2
              exit 1
            fi
            VERSION_STRING="${SOURCE_VERSION_STRING}"
          else
            # truncate '.post' from the version number for rolling releases to support cmake ASTL_VERSION_OVERRIDE
            VERSION_STRING=$("${{ github.workspace }}/ASTL/scripts/bump_version.sh" NONE "${SOURCE_VERSION_STRING}")
          fi
          echo "VERSION_STRING=${VERSION_STRING}" | tee -a $GITHUB_ENV
          echo "version=${VERSION_STRING}" >> "${GITHUB_OUTPUT}"

      - name: 📝 Verify Stable Release Metadata
        if: env.RELEASE_TYPE == 'STABLE'
        shell: bash
        run: |
          if [[ "${SOURCE_REF}" != "release-candidate/${VERSION_STRING}" && \
                ! "${SOURCE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Stable releases require release-candidate/${VERSION_STRING} or its full commit SHA." >&2
            exit 1
          fi

          "${{ github.workspace }}/ASTL/scripts/release/prepare_release.py" \
            --release-version "${VERSION_STRING}" \
            --check

          CANDIDATE_TAG="release-candidate/${VERSION_STRING}"
          if ! git -C "${{ github.workspace }}/ASTL" show-ref --verify --quiet "refs/tags/${CANDIDATE_TAG}"; then
            echo "Stable release candidate tag ${CANDIDATE_TAG} does not exist." >&2
            echo "Merge the Prepare Release PR before publishing." >&2
            exit 1
          fi
          CANDIDATE_COMMIT="$(git -C "${{ github.workspace }}/ASTL" rev-list -n 1 "refs/tags/${CANDIDATE_TAG}")"
          if [[ "${CANDIDATE_COMMIT}" != "${{ steps.source-metadata.outputs.sha }}" ]]; then
            echo "Stable release candidate ${CANDIDATE_TAG} points to ${CANDIDATE_COMMIT}, not ${{ steps.source-metadata.outputs.sha }}." >&2
            exit 1
          fi

          RELEASE_TAG="release/${VERSION_STRING}"
          if git -C "${{ github.workspace }}/ASTL" show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            TAG_COMMIT="$(git -C "${{ github.workspace }}/ASTL" rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            if [[ "${TAG_COMMIT}" != "${{ steps.source-metadata.outputs.sha }}" ]]; then
              echo "Stable release tag ${RELEASE_TAG} already points to ${TAG_COMMIT}, not ${{ steps.source-metadata.outputs.sha }}." >&2
              exit 1
            fi
            echo "Stable release tag ${RELEASE_TAG} already points to this commit; continuing retry."
          fi
          if [[ "${{ steps.source-metadata.outputs.is_main }}" == "true" ]] && \
            git -C "${{ github.workspace }}/ASTL" show-ref --verify --quiet \
              "refs/remotes/origin/release/${VERSION_STRING}"; then
            BRANCH_COMMIT="$(git -C "${{ github.workspace }}/ASTL" rev-parse \
              "refs/remotes/origin/release/${VERSION_STRING}")"
            if [[ "${BRANCH_COMMIT}" != "${{ steps.source-metadata.outputs.sha }}" ]]; then
              echo "Release branch release/${VERSION_STRING} already points to ${BRANCH_COMMIT}, not ${{ steps.source-metadata.outputs.sha }}." >&2
              exit 1
            fi
            echo "Release branch release/${VERSION_STRING} already points to this commit; continuing retry."
          fi

      - name: 🔒 Validate Public API Release Version
        if: env.RELEASE_TYPE == 'STABLE'
        run: |
          python3 "${{ github.workspace }}/ASTL/scripts/check_api_policy.py" \
            --base-ref HEAD \
            --base-is-exact \
            --release-version "${VERSION_STRING}" \
            --skip-pr-policy

      # Build via GitHub composite action =====
      - name: 🏗️ Build ASTL
        uses: ./ASTL/.github/actions/build
        with:
          os: ${{ matrix.os }}
          cmake_preset: release
          c_compiler: ${{ matrix.c_compiler }}
          cpp_compiler: ${{ matrix.cpp_compiler }}
          github_token: ${{ steps.source-checkout-token.outputs.token }}
          source_dir: ${{ github.workspace }}/ASTL
          version_override: ${{ env.VERSION_STRING }}

      - name: 📐 Determine Build Output Architecture
        run: |
          ASTL_BUILD_ARCH="$("${{ github.workspace }}/ASTL/scripts/host_arch.sh")"
          ASTL_BUILD_OUTPUT_DIR="${{ github.workspace }}/ASTL/build/release/${ASTL_BUILD_ARCH}"
          echo "ASTL_BUILD_ARCH=${ASTL_BUILD_ARCH}" | tee -a $GITHUB_ENV
          echo "ASTL_BUILD_OUTPUT_DIR=${ASTL_BUILD_OUTPUT_DIR}" | tee -a $GITHUB_ENV

      - name: 📐 Determine Artifact Names
        id: set_tag_output
        run: |

          if [[ "$(uname -s)" == "Linux" ]]; then
              OS_TYPE="linux"
          else
            echo "❌ Could not detect Linux OS when creating release package"
            echo "Detected OS: $(uname -s)"
            exit 1
          fi

          ARCH='aarch64'
          echo "OS_TYPE=${OS_TYPE}" | tee -a $GITHUB_ENV
          echo "ARCH=${ARCH}" | tee -a $GITHUB_ENV

          ARTIFACT_NAME_01_LIBRARY="astl_version_${{ env.VERSION_STRING }}_${OS_TYPE}_${ARCH}_library"
          echo "ARTIFACT_NAME_01_LIBRARY=${ARTIFACT_NAME_01_LIBRARY}" | tee -a  $GITHUB_ENV

          STAGING_PATH_01_LIBRARY="${{ github.workspace }}/${ARTIFACT_NAME_01_LIBRARY}"
          echo "STAGING_PATH_01_LIBRARY=${STAGING_PATH_01_LIBRARY}" | tee -a $GITHUB_ENV

          if [[ "${{ env.RELEASE_TYPE }}" == "ROLLING" ]]; then
            TAG_NAME="release/rolling"
          else
            TAG_NAME="release/${{ env.VERSION_STRING }}"
          fi
          echo "TAG_NAME=${TAG_NAME}" | tee -a $GITHUB_ENV
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: 📦 Test and stage public release
        run: |
          "${{ github.workspace }}/ASTL/scripts/release/stage_release.sh" \
            --skip-build \
            --version "${{ env.VERSION_STRING }}" \
            --output-dir "${{ github.workspace }}"

      - name: 🛠️ Prepare Bootstrap Installer Asset
        run: |
          install -m 0755 "${{ github.workspace }}/ASTL/scripts/release/get_astl.sh" "${{ github.workspace }}/get_astl.sh"

      - name: 🗑️ Delete Existing Rolling Release
        # Technically the second condition in the IF is redundant,
        # but it makes the intent clearer and adds an element of safety
        if: ${{ env.RELEASE_TYPE == 'ROLLING' && env.TAG_NAME == 'release/rolling' }}
        run: |
          # Check if release exists before trying to delete
          if gh release view "${{ env.TAG_NAME }}" --repo "${ASTL_REPOSITORY}" &> /dev/null; then
            echo "Deleting existing release: ${{ env.TAG_NAME }}"
            gh release delete "${{ env.TAG_NAME }}" --repo "${ASTL_REPOSITORY}" --yes --cleanup-tag
          else
            echo "No existing release found for ${{ env.TAG_NAME }}"
          fi
        env:
          GH_TOKEN: ${{ steps.source-checkout-token.outputs.token }}

      - name: 🌟 Create GitHub Release Page
        uses: softprops/action-gh-release@v3
        with:
          repository: Arm-Debug/ASTL
          token: ${{ steps.source-checkout-token.outputs.token }}
          tag_name: "${{ env.TAG_NAME }}"
          target_commitish: "${{ steps.source-metadata.outputs.sha }}"
          files: |
            ${{ github.workspace }}/${{ env.ARTIFACT_NAME_01_LIBRARY }}.zip
            ${{ github.workspace }}/${{ env.ARTIFACT_NAME_01_LIBRARY }}.zip.sha256
            ${{ github.workspace }}/get_astl.sh
          fail_on_unmatched_files: true
          # generate_release_notes: true will use the commit history to initialize the release landing page automatically.
          # This is not suitable as-is for external customers, the idea is to provide a starting point
          # for a human to edit into the final release notes.
          # You can make the edits directly in the GitHub UI.  No extra commits required.
          generate_release_notes: true
          # If you want to use a static release notes file, uncomment the line below and provide the path
          # body_path: RELEASE_NOTES.md
      - name: 🐸 Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v5
        with:
          version: 2.77.0

      - name: 🐸 Upload to Internal Artifactory
        shell: bash
        run: |
          echo "ARTIFACTORY_USER=${ARTIFACTORY_USER}"
          CI=true jf config add \
            --url "${ARTIFACTORY_URL}" \
            --user "${ARTIFACTORY_USER}" \
            --password "${ARTIFACTORY_TOKEN}"
          # Uniquify artifact names
          DATE_FOR_FILENAME=$(date '+%Y_%m_%d')
          UPLOADED_ARTIFACT_NAME_01_LIBRARY=${{ env.ARTIFACT_NAME_01_LIBRARY }}_${DATE_FOR_FILENAME}.zip
          echo "UPLOADED_ARTIFACT_NAME_01_LIBRARY=${UPLOADED_ARTIFACT_NAME_01_LIBRARY}"

          # Some Artifactory deployments return 404 for JFrog CLI usage reporting
          # (/artifactory/api/system/usage). Disable it so CI logs only show real upload failures.
          if [[ "${{ env.RELEASE_TYPE }}" == "ROLLING" ]]
          then
            RETENTION_POLICY="nightly"
          else
            RETENTION_POLICY="release"
          fi
          CI=true jf rt upload "${{ env.ARTIFACT_NAME_01_LIBRARY }}.zip" "its.astl/astl/${UPLOADED_ARTIFACT_NAME_01_LIBRARY}" --target-props='retention=${RETENTION_POLICY}'

        env:
          ARTIFACTORY_URL: https://eu-west-1.artifactory.aws.arm.com
          ARTIFACTORY_USER: svc_its_ci@arm.com
          ARTIFACTORY_TOKEN: ${{ secrets.ITS_ARTIFACTORY_ARM_KEY }}
          JFROG_CLI_REPORT_USAGE: "false"

      - name: 🧪 Out-Of-Box Testing
        uses: ./ASTL/.github/actions/out-of-box-testing
        with:
          astl_root: ${{ github.workspace }}/ASTL
          github_token: ${{ steps.source-checkout-token.outputs.token }}
          repository: Arm-Debug/ASTL
          tag_name: ${{ env.TAG_NAME }}

      - name: 🔑 Create post-release source token
        if: env.RELEASE_TYPE == 'STABLE' && steps.source-metadata.outputs.is_main == 'true'
        id: post-release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APAP_APP_APP_ID }}
          private-key: ${{ secrets.APAP_APP_PRIVATE_KEY }}
          owner: Arm-Debug
          repositories: ASTL
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: ⤵️ Configure Git to use post-release write credentials
        if: env.RELEASE_TYPE == 'STABLE' && steps.source-metadata.outputs.is_main == 'true'
        uses: actions/checkout@v7
        with:
          clean: false
          fetch-depth: 0
          path: ASTL
          ref: ${{ steps.source-metadata.outputs.sha }}
          submodules: false
          token: ${{ steps.post-release-token.outputs.token }}

      - name: 🌱 Create release branch and post-release version PR
        if: env.RELEASE_TYPE == 'STABLE' && steps.source-metadata.outputs.is_main == 'true'
        working-directory: ${{ github.workspace }}/ASTL
        env:
          GH_TOKEN: ${{ steps.post-release-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RELEASE_BRANCH="release/${VERSION_STRING}"
          POST_RELEASE_BRANCH="cicd/post_release/${VERSION_STRING}"

          if ! git show-ref --verify --quiet "refs/remotes/origin/${RELEASE_BRANCH}"; then
            git branch "${RELEASE_BRANCH}" "${{ steps.source-metadata.outputs.sha }}"
            git push origin "refs/heads/${RELEASE_BRANCH}:refs/heads/${RELEASE_BRANCH}"
          fi

          if ! git show-ref --verify --quiet "refs/remotes/origin/${POST_RELEASE_BRANCH}"; then
            git switch -c "${POST_RELEASE_BRANCH}" "${{ steps.source-metadata.outputs.sha }}"
            printf '%s.post\n' "${VERSION_STRING}" > VERSION.md
            git add VERSION.md
            git commit -m "[NO-JIRA] Start ${VERSION_STRING}.post development"
            git push --set-upstream origin "${POST_RELEASE_BRANCH}"
          fi

          if ! gh pr list --head "${POST_RELEASE_BRANCH}" --state all --json number --jq 'length > 0' | grep -qx true; then
            gh pr create \
              --base main \
              --head "${POST_RELEASE_BRANCH}" \
              --title "[NO-JIRA] Start ${VERSION_STRING}.post development" \
              --label "version-bump" \
              --body "$(printf '%s\n\n%s\n' \
                "Advances VERSION.md after publishing ${VERSION_STRING}." \
                '- [x] No public API or user-flow change')"
          fi
