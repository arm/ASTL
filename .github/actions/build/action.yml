name: 'Build ASTL'
description: 'Install dependencies, configure CMake, and build ASTL'

inputs:
  os:
    description: 'Operating system (ubuntu, windows-latest, macos-15)'
    required: true
  cmake_preset:
    description: 'CMake preset (release, debug, debug-valgrind-coverage)'
    required: true
  c_compiler:
    description: 'C compiler'
    required: true
  cpp_compiler:
    description: 'C++ compiler'
    required: true
  github_token:
    description: 'GitHub token used by actions inside this composite action'
    required: true

runs:
  using: "composite"
  steps:
    # Detect number of available cores for job parallelization
    - name: 🧠 Detect Core Count
      uses: SimenB/github-actions-cpu-cores@v2
      id: cpu-cores

    - name: ⤵️ Install apt-get Dependencies (ubuntu)
      if: contains(matrix.os, 'ubuntu')
      shell: bash
      run: |
        sudo apt-get -o DPkg::Lock::Timeout=300 update
        sudo apt-get -o DPkg::Lock::Timeout=300 install -y build-essential clang-20 clang-format-20 clang-tidy-20 cmake cppcheck g++ gcc gcovr jq libclang-rt-20-dev libsensors-dev ninja-build parallel pkg-config python3 python3-pip valgrind yamllint
        sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-20 200
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200
        sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-20 200
        sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-20 200

    - name: ⤵️ Install brew Dependencies (macos-15)
      if: inputs.os == 'macos-15'
      shell: bash
      run: |
        brew update
        brew install llvm
        echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

    - name: ⤵️ VCPKG - Restore Cache
      id: vcpkg-cache
      uses: TAServers/vcpkg-cache@v3
      with:
        token: ${{ inputs.github_token }}

    - name: ⤵️ VCPKG - Install Dependencies
      uses: lukka/run-vcpkg@v11
      env:
        VCPKG_FEATURE_FLAGS: binarycaching
        VCPKG_BINARY_SOURCES: clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite
      with:
        vcpkgDirectory: "${{ github.workspace }}/external/vcpkg"
        vcpkgJsonGlob: "**/vcpkg.json"

    - name: ⤵️ Setup MSVC Environment (windows)
      if: contains(inputs.os, 'windows')
      uses: ilammy/msvc-dev-cmd@v1

    - name: ⚙️ CMake - Configure
      if: inputs.os != 'macos-15'
      shell: bash
      env:
        VCPKG_FEATURE_FLAGS: binarycaching
        VCPKG_BINARY_SOURCES: clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite
      run: |
        cmake --version
        cmake -DCMAKE_CXX_COMPILER=${{ inputs.cpp_compiler }} -DCMAKE_C_COMPILER=${{ inputs.c_compiler }} -S "${{ github.workspace }}" --preset ${{ inputs.cmake_preset }}

    - name: ⚙️ CMake - Configure (macos-15)
      if: inputs.os == 'macos-15'
      shell: bash
      env:
        VCPKG_FEATURE_FLAGS: binarycaching
        VCPKG_BINARY_SOURCES: clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite
      run: |
        cmake --version
        cmake -S "${{ github.workspace }}" --preset ${{ inputs.cmake_preset }}

    - name: 🏗️ CMake - Build
      shell: bash
      run: cmake --build --parallel=${{ steps.cpu-cores.outputs.count }} --preset ${{ inputs.cmake_preset }} --verbose
