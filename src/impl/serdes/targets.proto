syntax = "proto3";

package astl.protobuf;

import "serdes/serdes_common.proto";

message Target {
  string name = 1;
  string description = 2;
  CollectorType collector_type = 3;
  optional uint32 parent_id = 4;
  optional string id = 5;
  optional string scmi_sysfs_subdirectory = 6;
}

message TargetList {
  repeated Target targets = 1;
}
