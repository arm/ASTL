syntax = "proto3";

package astl.protobuf;

import "serdes/serdes_common.proto";

message RawSample {
  uint32 operation_id = 1;
  uint64 timestamp_us = 2;
  AstlValue value = 3;
}

message RawSampleBatch {
  repeated RawSample samples = 1;
}
