syntax = "proto3";

package astl.protobuf;

import "serdes/serdes_common.proto";

message FiniteSetStateInfo {
  string label       = 1;
  string description = 2;
}

message FiniteSetMetric {
  map<int64, FiniteSetStateInfo> value_to_state_info = 1;
}

message StateInfo {
  string state_name = 1;
  double tick_frequency = 2;
}

message ResidencyMetric {
  StateInfo       state_info = 1;
  optional string inferred_state = 2;
}

message ScalingFormula {
  uint64 numerator   = 1;
  uint64 denominator = 2;
}

message FormulaStep {
  oneof step {
    bool           identity   = 1;
    ScalingFormula scaling    = 2;
    string         expression = 3;
  }
}

message FormulaPipeline {
  repeated FormulaStep steps = 1;
}

message IdentityFormula {}

message ExpressionFormula {
  string expression = 1;
}

message MetricFormula {
  oneof formula {
    IdentityFormula   identity   = 1;
    ScalingFormula    scaling    = 2;
    ExpressionFormula expression = 3;
    FormulaPipeline   pipeline   = 4;
  }
}

message MetricConfig {
  string          metric_name   = 1;
  string          description   = 2;
  AstlUnits       units         = 3;
  AstlValueType   value_type    = 4;
  AstlMetricType  metric_type   = 5;
  AstlMetricIdentifier    identifier      = 6;
  repeated string metric_groups = 7;
  CollectorType collector_type  = 8;
  // Raw collector sample type before formula/scaling processing.
  AstlValueType input_value_type = 9;
  // Persisted formula/scaling pipeline preserving runtime semantics.
  MetricFormula formula = 10;

  oneof metric {
    ResidencyMetric residency_metric = 20;
    FiniteSetMetric finite_set       = 21;
    // future derived metric messages go here
  }
}

message RawMetric {
  string      metric_id  = 1;
  MetricConfig config    = 2;
  repeated string      target_ids  = 3;
}

message RawMetricVec {
  repeated RawMetric metrics = 1;
}

message MetricGroup {
  string group_name = 1;
  string group_description = 2;
}

message OperationToMetric {
  uint32 operation_id = 1;
  string target_id    = 2;
  string metric_id    = 3;
}

message NativeToMonotonicRawRatio {
  int64 num = 1;
  int64 den = 2;
}

message OperationClockCorrelation {
  int64                    raw_monotonic_at_start_ns = 1;
  uint64                   native_at_start_ticks     = 2;
  NativeToMonotonicRawRatio ticks                    = 3;
}

message ClockCorrelationEntry {
  uint32                    operation_id = 1;
  OperationClockCorrelation correlation  = 2;
}

message MetricManager {
  repeated CollectorType capabilities = 1;
  // counter handles
  RawMetricVec metrics = 2;
  repeated OperationToMetric operation_to_metric_map = 3;
  repeated MetricGroup metric_groups = 4;
  repeated ClockCorrelationEntry clock_correlations = 5;
}
