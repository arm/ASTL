syntax = "proto3";

package astl.protobuf;

enum AstlUnits {
  ASTL_UNITS_NONE         = 0;
  ASTL_UNITS_TICKS        = 1;
  ASTL_UNITS_SECONDS      = 2;
  ASTL_UNITS_CELSIUS      = 3;
  ASTL_UNITS_JOULES       = 4;
  ASTL_UNITS_WATTS        = 5;
  ASTL_UNITS_VOLTS        = 6;
  ASTL_UNITS_AMPS         = 7;
  ASTL_UNITS_BYTES        = 8;
  ASTL_UNITS_MBYTESPERSEC = 9;
  ASTL_UNITS_MHERTZ       = 10;
  ASTL_UNITS_RPM          = 11;
  ASTL_UNITS_COUNT        = 12;
  ASTL_UNITS_PERCENT      = 13;
  // C unknown = 0xFFFFFFFF - handle that in conversion code.
  ASTL_UNITS_UNKNOWN_PROTO = 0xFF;
}

enum AstlValueType {
  ASTL_VALUE_UINT8   = 0;
  ASTL_VALUE_UINT16  = 1;
  ASTL_VALUE_UINT32  = 2;
  ASTL_VALUE_UINT64  = 3;
  ASTL_VALUE_FLOAT32 = 6;
  ASTL_VALUE_FLOAT64 = 7;
  ASTL_VALUE_BOOL8   = 8;
  ASTL_VALUE_UNKNOWN_PROTO = 0xFF;
}

enum AstlMetricType {
  ASTL_METRIC_VALUE            = 0;
  ASTL_METRIC_FINITE_SET_VALUE = 1;
  ASTL_METRIC_EVENT            = 2;
  ASTL_METRIC_DELTA            = 3;
  ASTL_METRIC_RESIDENCY        = 4;
  ASTL_METRIC_RATE             = 5;
  ASTL_METRIC_UNKNOWN_PROTO    = 0xFF;
}

enum AstlMetricIdentifier {
  ASTL_METRIC_IDENTIFIER_COUNT               = 0;
  ASTL_METRIC_IDENTIFIER_TEMPERATURE         = 1;
  ASTL_METRIC_IDENTIFIER_THERMAL_LIMIT       = 2;
  ASTL_METRIC_IDENTIFIER_THERMAL_THROTTLE    = 3;
  ASTL_METRIC_IDENTIFIER_ENERGY              = 4;
  ASTL_METRIC_IDENTIFIER_POWER               = 5;
  ASTL_METRIC_IDENTIFIER_POWER_LIMIT         = 6;
  ASTL_METRIC_IDENTIFIER_POWER_THROTTLE      = 7;
  ASTL_METRIC_IDENTIFIER_FREQUENCY           = 8;
  ASTL_METRIC_IDENTIFIER_VOLTAGE             = 9;
  ASTL_METRIC_IDENTIFIER_CURRENT             = 10;
  ASTL_METRIC_IDENTIFIER_BANDWIDTH           = 11;
  ASTL_METRIC_IDENTIFIER_FAN_SPEED           = 12;
  ASTL_METRIC_IDENTIFIER_HUMIDITY            = 13;
  ASTL_METRIC_IDENTIFIER_STATUS              = 14;
  ASTL_METRIC_IDENTIFIER_UNKNOWN_PROTO       = 0xFF;
}

enum CollectorType {
  COLLECTOR_TYPE_UNKNOWN     = 0;
  COLLECTOR_TYPE_SCMI        = 1;
  COLLECTOR_TYPE_LIBSENSORS  = 2;
  COLLECTOR_TYPE_PROCFS      = 3;
  COLLECTOR_TYPE_ASTL_NATIVE = 4;
}

message AstlValue {
  oneof value {
    uint32 uint8_value   = 1;
    uint32 uint16_value  = 2;
    uint32 uint32_value  = 3;
    uint64 uint64_value  = 4;
    float  float_value   = 5;
    double double_value  = 6;
    bool   bool_value    = 7;
  }
}
